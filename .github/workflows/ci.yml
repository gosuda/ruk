name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ['**']
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  export-model:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: export-model
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        id: rust
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Export the model for dependent clients
        id: export_model
        if: ${{ !cancelled() }}
        run: cargo run --locked -p ruk -- model --format json > "$RUNNER_TEMP/ruk-model.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.export_model.outcome == 'success' }}
        with:
          name: ruk-model-${{ github.sha }}
          path: ${{ runner.temp }}/ruk-model.json
          if-no-files-found: error
          retention-days: 7
  linux:
    name: linux
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        id: rust
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - run: cargo fmt --all -- --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        id: nextest
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --locked
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.nextest.outcome == 'success' }}
      - run: cargo test --workspace --doc --locked
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
  native:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [depot-macos-latest, depot-windows-2025-8]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        id: rust
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        id: nextest
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
      - run: cargo nextest run --workspace --locked
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.nextest.outcome == 'success' }}
      - run: cargo test --workspace --locked --doc --no-fail-fast
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
