name: ci

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export-model:
    name: export-model
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - name: Export the model for dependent clients
        id: export_model
        if: ${{ !cancelled() }}
        run: cargo run --locked -p ruk -- model --format json > "$RUNNER_TEMP/ruk-model.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() && steps.export_model.outcome == 'success' }}
        with:
          name: ruk-model-${{ github.sha }}
          path: ${{ runner.temp }}/ruk-model.json
          if-no-files-found: error
          retention-days: 7

  linux:
    name: linux
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'merge_group' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --locked
      - run: cargo test --workspace --doc --locked

  clippy:
    name: clippy-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [depot-macos-latest, depot-windows-2025]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  nextest:
    name: nextest-depot-macos-latest
    runs-on: depot-macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --workspace --locked

  nextest-windows-cli:
    name: nextest-windows-8-cli
    runs-on: depot-windows-2025-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --locked -p ruk-git -p ruk

  nextest-windows-core:
    name: nextest-windows-8-core
    runs-on: depot-windows-2025-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --locked -p ruk-core -E 'not test(seal_boundary_postcommit_kill_keeps_sealed_segments_sha1)'

  nextest-windows-crash:
    name: nextest-windows-8-crash
    runs-on: depot-windows-2025-8
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ hashFiles('**/Cargo.lock') }}
          cache-bin: false
          cache-on-failure: true
          save-if: true # TEMP: warm the branch cache for measurement; reverted next
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-nextest@0.9.148
      - run: cargo nextest run --locked -p ruk-core -E 'test(seal_boundary_postcommit_kill_keeps_sealed_segments_sha1)'
