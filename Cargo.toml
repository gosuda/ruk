[workspace]
resolver = "3"
members = ["crates/ruk-core", "crates/ruk-git", "crates/ruk"]
exclude = ["crates/ruk-core/vendor/redb"]

[patch.crates-io]
redb = { path = "crates/ruk-core/vendor/redb" }
# swc_common 12.0.1 (via mdxjs -> swc_core) re-exports serde::__private, which
# the pinned serde 1.0.229 facade no longer has. The vendored copy removes that
# one dead alias; nothing in the crate reads it. Keep this pin until the mdxjs
# graph reaches swc_common >= 15.0.0.
swc_common = { path = "crates/ruk-core/vendor/swc_common" }

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace.dependencies]
# Exact Git object identity and object readers (slice-1 uses gix-hash directly).
gix-hash = { version = "=0.28.0", default-features = false, features = ["sha1", "sha256"] }
gix-object = { version = "=0.66.0", default-features = false, features = ["serde", "sha1", "sha256"] }
gix-pack = { version = "=0.76.0" }
gix-protocol = { version = "=0.67.0" }
gix-transport = { version = "=0.61.0" }
gix-ref = { version = "=0.69.0" }
gix-url = { version = "=0.40.0" }
flate2 = { version = "=1.1.10" }
# Zip archives (`ruk archive --format=zip`): writer only (stored + deflate
# through the already-pinned flate2); none of the aes/bzip2/lzma/ppmd/zstd
# readers the default feature set would pull in.
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
memmap2 = { version = "=0.9.11" }
bstr = { version = "=1.13.1", default-features = false, features = ["std"] }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
# Internal typed values (core contract).
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
redb = { version = "=4.4.0", default-features = false }
zstd = { version = "=0.14.3", default-features = false }
crc32c = { version = "=0.6.8", default-features = false }
atomicwrites = { version = "=0.4.4", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
# Executable boundary only.
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "serde"] }
uuid = { version = "=1.28.0", default-features = false, features = ["std", "v4", "serde"] }
sonic-rs = { version = "=0.5.10", features = ["sort_keys"] }
stacker = { version = "=0.1.25", default-features = false }
tokio = { version = "=1.53.3", default-features = false, features = ["net", "io-util", "sync", "time", "process", "signal", "rt-multi-thread", "macros"] }
getrandom = { version = "=0.4.3", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
# Minimal HTTPS for the git-lfs batch API only (transport::http): pure-Rust
# TLS with Mozilla roots; no platform glue (native-tls is out of scope).
# Direct count stays at two: ring arrives transitively via the feature.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "tls12", "ring"] }
webpki-roots = { version = "=1.0.10" }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
ssh-key = { version = "=0.6.7", default-features = false, features = ["ed25519", "std"] }
roaring = { version = "=0.11.5", default-features = false, features = ["std"] }
logos = { version = "=0.16.1", default-features = false, features = ["export_derive", "std"] }
smallvec = { version = "=1.16.3", default-features = false, features = ["const_new", "serde", "union"] }
# Content search (`ruk grep`, git/builtin/grep.c): byte-oriented matching so
# binary worktree files never break the scan. Already in the lock graph
# transitively; pinned here as a direct dependency.
regex = { version = "=1.13.1" }
# Pinned syntax-merge grammars (ABI 13..=15 against tree-sitter 0.27.1).
tree-sitter = { version = "=0.27.1", default-features = false, features = ["std"] }
tree-sitter-language = "=0.1.9"
tree-sitter-rust = "=0.24.2"
tree-sitter-python = "=0.25.0"
tree-sitter-go = "=0.25.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
tree-sitter-html = "=0.23.2"
tree-sitter-css = "=0.25.0"
tree-sitter-json = "=0.24.8"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-java = "=0.23.5"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-swift = "=0.7.4"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.25.1"
tree-sitter-bash = "=0.25.1"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-lua = "=0.5.0"
mdxjs = "=1.0.4"
markdown = "=1.0.0"

# Property tests for the ported jj algebra.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = { level = "deny" }
missing_debug_implementations = { level = "warn" }
non_ascii_idents = { level = "deny" }
unreachable_pub = { level = "warn" }

[workspace.lints.clippy]
dbg_macro = { level = "deny" }
todo = { level = "deny" }
unimplemented = { level = "deny" }
undocumented_unsafe_blocks = { level = "deny" }
panic_in_result_fn = { level = "warn" }
print_stdout = { level = "allow" }
allow_attributes = { level = "deny" }

[profile.release]
lto = "thin"
