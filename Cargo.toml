[workspace]
resolver = "3"
members = ["crates/ruk-core", "crates/ruk-git", "crates/ruk"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"

[workspace.dependencies]
# Exact Git object identity and object readers (slice-1 uses gix-hash directly).
gix-hash = { version = "=0.28.0", default-features = false, features = ["sha1", "sha256"] }
# Internal typed values (core contract).
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
redb = { version = "=4.4.0", default-features = false }
zstd = { version = "=0.14.2", default-features = false }
crc32c = { version = "=0.6.8", default-features = false }
atomicwrites = { version = "=0.4.4", default-features = false }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
# Executable boundary only.
anyhow = { version = "=1.0.104", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
jiff = { version = "=0.2.38", default-features = false, features = ["std", "serde"] }
uuid = { version = "=1.28.0", default-features = false, features = ["std", "v4", "serde"] }
sonic-rs = { version = "=0.5.10", features = ["sort_keys"] }
stacker = { version = "=0.1.25", default-features = false }
smallvec = { version = "=1.16.3", default-features = false, features = ["const_new", "serde", "union"] }
# Property tests for the ported jj algebra.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = { level = "deny" }
missing_debug_implementations = { level = "warn" }
non_ascii_idents = { level = "deny" }
unreachable_pub = { level = "warn" }

[workspace.lints.clippy]
dbg_macro = { level = "deny" }
todo = { level = "deny" }
unimplemented = { level = "deny" }
undocumented_unsafe_blocks = { level = "deny" }
panic_in_result_fn = { level = "warn" }
print_stdout = { level = "allow" }
allow_attributes = { level = "deny" }

[profile.release]
lto = "thin"
